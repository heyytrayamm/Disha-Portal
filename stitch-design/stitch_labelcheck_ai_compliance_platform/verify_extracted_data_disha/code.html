<script>
        // Simple interaction for input focus halo
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('border-primary', 'ring-2', 'ring-primary/15');
                this.parentElement.classList.remove('border-border-subtle');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('border-primary', 'ring-2', 'ring-primary/15');
                this.parentElement.classList.add('border-border-subtle');
            });
        });
    </script>
